<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #F59E4B; }
      /* No text selection, magnifier or callout menus on touch devices. */
      body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
      /* The game fills whatever space its frame gives it. */
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; background: #F59E4B; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 background: linear-gradient(#FFE2B0, #F59E4B); font-family: Arial, Helvetica, sans-serif; color: #4A2108; }
      #loading h1 { font-size: 7vmin; margin: 0 0 4vmin; letter-spacing: 0.05em; }
      #bar { width: 50vmin; height: 2.4vmin; border-radius: 1.2vmin; background: rgba(59, 35, 20, 0.35); overflow: hidden; }
      #bar-full { width: 0%; height: 100%; background: #3B2314; }
      #error { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px; background: #B3261E; color: #fff;
               font-family: Arial, Helvetica, sans-serif; text-align: center; display: none; }
    </style>
  </head>
  <body oncontextmenu="return false;">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>{{{ PRODUCT_NAME }}}</h1>
      <div id="bar"><div id="bar-full"></div></div>
    </div>
    <div id="error"></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        document.getElementById("bar-full").style.width = (100 * progress) + "%";
      }).then(function () {
        document.getElementById("loading").style.display = "none";
      }).catch(function (message) {
        var box = document.getElementById("error");
        box.textContent = String(message);
        box.style.display = "block";
      });
    </script>
  </body>
</html>
